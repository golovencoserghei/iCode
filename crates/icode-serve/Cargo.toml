[package]
name = "icode-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iCode v2 serving: rmcp MCP server (stdio/HTTP) + axum web dashboard (impl from M1/M7)"

[dependencies]
icode-core = { workspace = true }
icode-engine = { workspace = true }
anyhow = { workspace = true }
rmcp = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `tower::ServiceExt::oneshot` drives the axum router in web.rs unit tests
# without binding a socket.
tower = { version = "0.5", features = ["util"] }
