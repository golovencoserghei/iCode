<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCode dashboard</title>
<!--
  Single embedded page (served by icode-serve via include_str!). Vanilla
  HTML+CSS+JS — NO external CDN, NO network beyond the same-origin REST API.
  Everything ships in the binary so the dashboard works fully offline.
-->
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-soft2: #1c2129;
    --border: #2d333b;
    --fg: #e6edf3;
    --fg-dim: #8b949e;
    --accent: #58a6ff;
    --accent-dim: #1f6feb;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  header h1 .v2 { color: var(--accent); }
  header .sub { color: var(--fg-dim); font-size: 12px; }
  header .statline { margin-left: auto; color: var(--fg-dim); font-size: 12px; font-family: var(--mono); }

  nav.tabs { display: flex; gap: 2px; padding: 0 22px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
  nav.tabs button {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--fg-dim);
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  nav.tabs button:hover { color: var(--fg); }
  nav.tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }

  main { padding: 20px 22px; max-width: 1280px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  input[type=text], select {
    background: var(--bg-soft2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--sans);
  }
  input[type=text] { flex: 1; min-width: 220px; }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--accent-dim); }
  button.btn {
    background: var(--accent-dim);
    border: 1px solid var(--accent-dim);
    color: #fff;
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  button.btn:hover { background: var(--accent); border-color: var(--accent); }
  button.btn.ghost { background: transparent; color: var(--accent); }
  button.btn.ghost:hover { background: var(--bg-soft2); }
  label.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-dim); font-size: 13px; cursor: pointer; user-select: none; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .card.click { cursor: pointer; }
  .card.click:hover { border-color: var(--accent-dim); }
  .card .title { font-weight: 600; font-size: 14px; }
  .card .qn { color: var(--fg-dim); font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .card .loc { color: var(--accent); font-family: var(--mono); font-size: 12px; }
  .card .meta { color: var(--fg-dim); font-size: 12px; margin-top: 4px; }
  .score { color: var(--warn); font-family: var(--mono); font-size: 12px; }

  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    border: 1px solid var(--border);
  }
  .badge.decision { color: #d2a8ff; border-color: #8957e5; }
  .badge.progress { color: var(--good); border-color: var(--good); }
  .badge.context  { color: var(--accent); border-color: var(--accent-dim); }
  .badge.bug      { color: var(--bad); border-color: var(--bad); }
  .badge.todo     { color: var(--warn); border-color: var(--warn); }
  .badge.code     { color: #79c0ff; border-color: #388bfd; }
  .badge.general  { color: var(--fg-dim); }
  .age { font-size: 11px; color: var(--fg-dim); }
  .age.fresh { color: var(--good); }
  .age.recent { color: var(--accent); }
  .age.aging { color: var(--warn); }
  .age.stale { color: var(--bad); }

  .content-text { white-space: pre-wrap; margin-top: 6px; font-size: 13px; }
  .colhead { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--fg-dim); margin-bottom: 8px; font-weight: 700; }
  .empty, .state { color: var(--fg-dim); padding: 14px 4px; font-size: 13px; }
  .state.err { color: var(--bad); }
  .state.warn { color: var(--warn); }

  pre.detail {
    background: var(--bg-soft2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; text-align: center; }
  .stat .n { font-size: 22px; font-weight: 700; font-family: var(--mono); }
  .stat .l { font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--bg-soft2); border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; font-size: 12px; font-family: var(--mono); color: var(--fg-dim); }
  h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--fg-dim); margin: 18px 0 8px; }
  .tags { display: inline-flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 11px; color: var(--fg-dim); font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>iCode <span class="v2">v2</span></h1>
  <span class="sub">local code-graph + memory dashboard</span>
  <span class="statline" id="statline">loading…</span>
</header>

<nav class="tabs">
  <button data-tab="code" class="active">Code</button>
  <button data-tab="memory">Memory</button>
  <button data-tab="recall">Recall</button>
</nav>

<main>
  <!-- ─────────────────── CODE ─────────────────── -->
  <section class="panel active" id="panel-code">
    <div class="row">
      <input type="text" id="code-q" placeholder="Search code by name or meaning… (e.g. parse, hybrid search)" autocomplete="off">
      <button class="btn" id="code-search-btn">Search</button>
      <button class="btn ghost" id="repomap-btn">Repo map</button>
    </div>
    <div class="cols">
      <div>
        <div class="colhead">Results</div>
        <div id="code-results"><div class="empty">Type a query and hit Search.</div></div>
      </div>
      <div>
        <div class="colhead">Detail</div>
        <div id="code-detail"><div class="empty">Click a result to see its definition, callers and callees.</div></div>
      </div>
    </div>
  </section>

  <!-- ─────────────────── MEMORY ─────────────────── -->
  <section class="panel" id="panel-memory">
    <div class="row">
      <select id="mem-project"><option value="">(all projects)</option></select>
      <input type="text" id="mem-q" placeholder="Search memory (leave empty to list recent)…" autocomplete="off">
      <button class="btn" id="mem-search-btn">Search</button>
      <label class="chk"><input type="checkbox" id="mem-resolved"> include resolved</label>
    </div>
    <div id="mem-results"><div class="empty">Pick a project (or search) to list memories.</div></div>
  </section>

  <!-- ─────────────────── RECALL ─────────────────── -->
  <section class="panel" id="panel-recall">
    <div class="row">
      <select id="recall-project"><option value="">(all projects)</option></select>
      <input type="text" id="recall-q" placeholder="Task / question to recall code AND memory for…" autocomplete="off">
      <button class="btn" id="recall-btn">Recall</button>
    </div>
    <div class="cols">
      <div>
        <div class="colhead">relevant_code</div>
        <div id="recall-code"><div class="empty">—</div></div>
      </div>
      <div>
        <div class="colhead">relevant_memory</div>
        <div id="recall-memory"><div class="empty">—</div></div>
      </div>
    </div>
    <h3 class="sec">facts</h3>
    <div id="recall-facts"><div class="empty">—</div></div>
  </section>
</main>

<script>
"use strict";

// ──────────────── tiny helpers ────────────────
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};
// Escape for safe text injection (no HTML in API strings is rendered raw).
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

async function api(path) {
  try {
    const r = await fetch(path, { headers: { "Accept": "application/json" } });
    const data = await r.json();
    return { ok: true, data };
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}
// API contract: degraded backends return {"error": "..."} with HTTP 200.
const apiErr = (res) => res && res.data && typeof res.data === "object" && !Array.isArray(res.data) && res.data.error;

function setState(target, kind, msg) {
  target.innerHTML = "";
  target.appendChild(el("div", "state " + (kind || ""), esc(msg)));
}

// ──────────────── tabs ────────────────
document.querySelectorAll("nav.tabs button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    $("#panel-" + btn.dataset.tab).classList.add("active");
  });
});

// ──────────────── header stats ────────────────
async function loadStats() {
  const res = await api("/api/stats");
  const s = res.ok && res.data && !apiErr(res) ? res.data : null;
  if (!s) { $("#statline").textContent = "stats unavailable"; return; }
  $("#statline").textContent =
    `${s.files} files · ${s.functions} fn · ${s.classes} cls · ${s.calls} calls · ${s.routes} routes · ${s.code_chunks} chunks`;
}

// ──────────────── CODE tab ────────────────
function codeCard(hit) {
  const c = el("div", "card click");
  c.appendChild(el("div", "title", esc(hit.name) + (hit.stale ? ' <span class="age stale">stale</span>' : "")));
  c.appendChild(el("div", "qn", esc(hit.qualified_name)));
  c.appendChild(el("div", "loc", esc(hit.path) + ":" + hit.line_start));
  c.appendChild(el("div", "meta",
    `<span class="badge ${esc(hit.kind)}">${esc(hit.kind)}</span> <span class="score">score ${(+hit.score).toFixed(3)}</span>`));
  c.addEventListener("click", () => loadSymbol(hit.name));
  return c;
}

async function searchCode() {
  const q = $("#code-q").value.trim();
  const box = $("#code-results");
  if (!q) { setState(box, "", "Enter a query."); return; }
  setState(box, "", "loading…");
  const res = await api(`/api/search/code?q=${encodeURIComponent(q)}&limit=25`);
  if (!res.ok) { setState(box, "err", "request failed: " + res.error); return; }
  if (apiErr(res)) { setState(box, "warn", res.data.error); return; }
  const hits = res.data;
  if (!Array.isArray(hits) || hits.length === 0) { setState(box, "", "no results"); return; }
  box.innerHTML = "";
  hits.forEach((h) => box.appendChild(codeCard(h)));
}

async function loadSymbol(name) {
  const box = $("#code-detail");
  setState(box, "", "loading…");
  const res = await api(`/api/symbol?name=${encodeURIComponent(name)}`);
  if (!res.ok) { setState(box, "err", "request failed: " + res.error); return; }
  if (apiErr(res)) { setState(box, "warn", res.data.error); return; }
  const ctx = res.data;
  box.innerHTML = "";

  const def = ctx.definition;
  if (def) {
    const inner = def.Function || def.Class || def; // serde tag="kind" flattens; be lenient
    const head = el("div", "card");
    head.appendChild(el("div", "title", esc(inner.name || name)));
    head.appendChild(el("div", "qn", esc(inner.qualified_name || "")));
    head.appendChild(el("div", "loc", esc(inner.path || "") + ":" + (inner.line_start || "")));
    if (inner.args) head.appendChild(el("div", "meta", "args: " + esc(inner.args)));
    if (inner.docstring) head.appendChild(el("div", "content-text", esc(inner.docstring)));
    box.appendChild(head);
  } else {
    box.appendChild(el("div", "empty", "no definition found for " + esc(name)));
  }

  const callList = (label, calls) => {
    box.appendChild(el("h3", "sec", label + " (" + (calls ? calls.length : 0) + ")"));
    if (!calls || calls.length === 0) { box.appendChild(el("div", "empty", "—")); return; }
    calls.forEach((c) => {
      const name = c.callee || c.caller || c.name || c.qualified_name || JSON.stringify(c);
      const where = (c.path ? esc(c.path) + (c.line ? ":" + c.line : "") : "");
      const card = el("div", "card");
      card.appendChild(el("div", "qn", esc(name)));
      if (where) card.appendChild(el("div", "loc", where));
      box.appendChild(card);
    });
  };
  callList("Callers", ctx.callers);
  callList("Callees", ctx.callees);

  if (ctx.similar_symbols && ctx.similar_symbols.length) {
    box.appendChild(el("h3", "sec", "Similar (" + ctx.similar_symbols.length + ")"));
    ctx.similar_symbols.forEach((h) => box.appendChild(codeCard(h)));
  }
}

async function loadRepoMap() {
  const box = $("#code-detail");
  setState(box, "", "loading…");
  const res = await api("/api/repo-map?top=20");
  if (!res.ok) { setState(box, "err", "request failed: " + res.error); return; }
  if (apiErr(res)) { setState(box, "warn", res.data.error); return; }
  const m = res.data;
  box.innerHTML = "";

  const s = m.stats || {};
  const grid = el("div", "grid-stats");
  [["files", s.files], ["functions", s.functions], ["classes", s.classes],
   ["calls", s.calls], ["routes", s.routes], ["chunks", s.code_chunks]].forEach(([l, n]) => {
    const st = el("div", "stat");
    st.appendChild(el("div", "n", n == null ? "0" : esc(n)));
    st.appendChild(el("div", "l", l));
    grid.appendChild(st);
  });
  box.appendChild(grid);

  if (m.languages && m.languages.length) {
    box.appendChild(el("h3", "sec", "Languages"));
    const chips = el("div", "chips");
    m.languages.forEach(([lang, n]) => chips.appendChild(el("span", "chip", esc(lang) + " · " + n)));
    box.appendChild(chips);
  }

  if (m.complex_functions && m.complex_functions.length) {
    box.appendChild(el("h3", "sec", "Top complex functions"));
    m.complex_functions.forEach((f) => {
      const card = el("div", "card");
      card.appendChild(el("div", "qn", esc(f.qualified_name)));
      card.appendChild(el("div", "loc", esc(f.path) + ":" + f.line_start));
      card.appendChild(el("div", "meta",
        `span ${f.span} · fan-out ${f.fan_out} · callers ${f.callers} · <span class="score">${(+f.score).toFixed(2)}</span>`));
      box.appendChild(card);
    });
  }

  if (m.modules && m.modules.length) {
    box.appendChild(el("h3", "sec", "Modules"));
    m.modules.forEach((mod) => {
      const card = el("div", "card");
      card.appendChild(el("div", "qn", esc(mod.module)));
      card.appendChild(el("div", "meta", `${mod.files} files · ${mod.functions} fn · ${mod.classes} cls`));
      box.appendChild(card);
    });
  }

  if (m.call_hotspots && m.call_hotspots.length) {
    box.appendChild(el("h3", "sec", "Call hotspots"));
    const chips = el("div", "chips");
    m.call_hotspots.forEach(([name, n]) => chips.appendChild(el("span", "chip", esc(name) + " ×" + n)));
    box.appendChild(chips);
  }
}

// ──────────────── MEMORY tab ────────────────
function memCard(m) {
  // search → MemoryHit ({...record, score, age_days, age_status});
  // list → MemoryRecord (no score/age). Both carry the record fields directly.
  const card = el("div", "card");
  const cat = (m.category || "general");
  const head = el("div", "meta");
  let badges = `<span class="badge ${esc(cat)}">${esc(cat)}</span>`;
  if (m.age_status) badges += ` <span class="age ${esc(m.age_status)}">${esc(m.age_status)}${m.age_days != null ? " · " + m.age_days + "d" : ""}</span>`;
  if (m.score != null) badges += ` <span class="score">score ${(+m.score).toFixed(3)}</span>`;
  if (m.importance != null) badges += ` <span class="age">imp ${(+m.importance).toFixed(1)}</span>`;
  if (m.status === "resolved") badges += ` <span class="age stale">resolved</span>`;
  head.innerHTML = badges;
  card.appendChild(head);
  card.appendChild(el("div", "content-text", esc(m.content)));
  if (m.tags && m.tags.length) {
    const t = el("div", "tags");
    m.tags.forEach((tag) => t.appendChild(el("span", "tag", "#" + esc(tag))));
    card.appendChild(t);
  }
  return card;
}

async function searchMemory() {
  const project = $("#mem-project").value;
  const q = $("#mem-q").value.trim();
  const incl = $("#mem-resolved").checked;
  const box = $("#mem-results");
  setState(box, "", "loading…");
  const url = `/api/memory?project=${encodeURIComponent(project)}&q=${encodeURIComponent(q)}&limit=30&include_resolved=${incl}`;
  const res = await api(url);
  if (!res.ok) { setState(box, "err", "request failed: " + res.error); return; }
  if (apiErr(res)) { setState(box, "warn", res.data.error); return; }
  const items = res.data;
  if (!Array.isArray(items) || items.length === 0) {
    setState(box, "", project || q ? "no memories" : "memory unavailable (start Ollama) or empty");
    return;
  }
  box.innerHTML = "";
  items.forEach((m) => box.appendChild(memCard(m)));
}

// ──────────────── RECALL tab ────────────────
async function runRecall() {
  const project = $("#recall-project").value || "general";
  const q = $("#recall-q").value.trim();
  const codeBox = $("#recall-code"), memBox = $("#recall-memory"), factBox = $("#recall-facts");
  if (!q) { setState(codeBox, "", "Enter a query."); return; }
  setState(codeBox, "", "loading…"); setState(memBox, "", "loading…"); setState(factBox, "", "—");
  const res = await api(`/api/recall?project=${encodeURIComponent(project)}&q=${encodeURIComponent(q)}&limit=8`);
  if (!res.ok) { setState(codeBox, "err", "request failed: " + res.error); setState(memBox, "err", "—"); return; }
  if (apiErr(res)) { setState(codeBox, "warn", res.data.error); setState(memBox, "warn", "—"); return; }
  const r = res.data;

  if (r.relevant_code && r.relevant_code.length) {
    codeBox.innerHTML = "";
    r.relevant_code.forEach((h) => codeBox.appendChild(codeCard(h)));
  } else setState(codeBox, "", "—");

  if (r.relevant_memory && r.relevant_memory.length) {
    memBox.innerHTML = "";
    r.relevant_memory.forEach((m) => memBox.appendChild(memCard(m)));
  } else setState(memBox, "", "—");

  if (r.facts && r.facts.length) {
    factBox.innerHTML = "";
    r.facts.forEach((f) => {
      const card = el("div", "card");
      card.appendChild(el("div", "qn", `${esc(f.subject)} — ${esc(f.predicate)} → ${esc(f.object)}`));
      factBox.appendChild(card);
    });
  } else setState(factBox, "", "—");
}

// ──────────────── project pickers ────────────────
async function loadProjects() {
  const res = await api("/api/memory/projects");
  if (!res.ok || apiErr(res) || !Array.isArray(res.data)) return;
  const opts = res.data.map(([name, count]) =>
    `<option value="${esc(name)}">${esc(name)} (${count})</option>`).join("");
  $("#mem-project").innerHTML = `<option value="">(all projects)</option>` + opts;
  $("#recall-project").innerHTML = `<option value="">(all projects)</option>` + opts;
}

// ──────────────── wiring ────────────────
$("#code-search-btn").addEventListener("click", searchCode);
$("#code-q").addEventListener("keydown", (e) => { if (e.key === "Enter") searchCode(); });
$("#repomap-btn").addEventListener("click", loadRepoMap);
$("#mem-search-btn").addEventListener("click", searchMemory);
$("#mem-q").addEventListener("keydown", (e) => { if (e.key === "Enter") searchMemory(); });
$("#mem-project").addEventListener("change", searchMemory);
$("#mem-resolved").addEventListener("change", searchMemory);
$("#recall-btn").addEventListener("click", runRecall);
$("#recall-q").addEventListener("keydown", (e) => { if (e.key === "Enter") runRecall(); });

loadStats();
loadProjects();
</script>
</body>
</html>
