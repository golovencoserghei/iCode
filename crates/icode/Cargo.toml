[package]
name = "icode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iCode v2 — local RAG: code-graph understanding + cross-session project memory"

[[bin]]
name = "icode"
path = "src/main.rs"

[dependencies]
icode-core = { workspace = true }
icode-engine = { workspace = true }
icode-embed = { workspace = true }
icode-serve = { workspace = true }
anyhow = { workspace = true }
# Daemon lifecycle: detach the watcher into its own session (setsid) and probe/stop
# it by PID. The lock itself lives in icode-engine.
libc = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Bin-level hook integration test: seed a temp central db row directly (no Ollama)
# and drive the real `icode hook …` binary over it.
rusqlite = { workspace = true }
tempfile = "3"
